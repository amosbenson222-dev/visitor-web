<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Check-In</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Poppins', Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #16294f 0%, #1F3864 45%, #3b5998 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
  }
  .card {
    background: #fff;
    max-width: 420px;
    width: 100%;
    padding: 34px 26px;
    border-radius: 18px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.28);
    animation: fadeUp 0.5s ease-out;
  }
  .badge {
    width: 54px; height: 54px;
    background: linear-gradient(135deg, #1F3864, #4a6ba8);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    animation: popIn 0.5s ease-out 0.1s backwards;
  }
  .badge svg { width: 26px; height: 26px; stroke: #fff; }
  h1 {
    font-size: 21px;
    margin: 0 0 4px;
    color: #1F3864;
    text-align: center;
    font-weight: 700;
  }
  .subtitle {
    text-align: center;
    color: #90979f;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .field {
    margin-top: 16px;
    opacity: 0;
    animation: fadeUp 0.4s ease-out forwards;
  }
  .field:nth-of-type(1) { animation-delay: 0.15s; }
  .field:nth-of-type(2) { animation-delay: 0.20s; }
  .field:nth-of-type(3) { animation-delay: 0.25s; }
  .field:nth-of-type(4) { animation-delay: 0.30s; }
  label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: #555;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-transform: uppercase;
  }
  label svg { width: 14px; height: 14px; stroke: #1F3864; flex-shrink: 0; }
  .input-wrap { position: relative; margin-top: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e6e9f0;
    border-radius: 10px;
    box-sizing: border-box;
    font-size: 15px;
    font-family: inherit;
    background: #f8f9fc;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #1F3864;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(31,56,100,0.08);
  }
  button {
    margin-top: 26px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1F3864, #3b5998);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 8px 18px rgba(31,56,100,0.3);
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.7; cursor: default; }
  .spinner {
    width: 16px; height: 16px;
    border: 2.5px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status {
    margin-top: 16px;
    font-size: 14px;
    text-align: center;
    font-weight: 600;
    min-height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  #status.success { color: #1e8e3e; animation: popIn 0.3s ease-out; }
  #status.error { color: #d93025; animation: popIn 0.3s ease-out; }
  #status svg { width: 17px; height: 17px; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
  </div>
  <h1>Visitor Check-In</h1>
  <p class="subtitle">Please fill in your details below</p>

  <form id="visitorForm">
    <div class="field">
      <label><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Full Name</label>
      <div class="input-wrap"><input type="text" id="name" required></div>
    </div>

    <div class="field">
      <label><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Phone Number</label>
      <div class="input-wrap"><input type="text" id="phone" required></div>
    </div>

    <div class="field">
      <label><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>Purpose of Visit</label>
      <div class="input-wrap"><input type="text" id="purpose" required></div>
    </div>

    <div class="field">
      <label><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Person/Host to See</label>
      <div class="input-wrap"><input type="text" id="host" required></div>
    </div>

    <button type="submit" id="submitBtn">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">Check In</span>
    </button>
    <div id="status"></div>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDa0X6lqLr56HGdtgVkvUIGbfbJj9jOsYw",
    authDomain: "visitor-management-syste-fd524.firebaseapp.com",
    databaseURL: "https://visitor-management-syste-fd524-default-rtdb.firebaseio.com",
    projectId: "visitor-management-syste-fd524",
    storageBucket: "visitor-management-syste-fd524.firebasestorage.app",
    messagingSenderId: "789269734621",
    appId: "1:789269734621:web:071dc82156fad17ab22734"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const form = document.getElementById("visitorForm");
  const status = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");
  const spinner = document.getElementById("spinner");
  const btnText = document.getElementById("btnText");

  const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="#1e8e3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  const errorIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="#d93025" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>';

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    spinner.style.display = "inline-block";
    btnText.textContent = "Checking in...";
    submitBtn.disabled = true;
    status.className = "";
    status.innerHTML = "";

    const visitor = {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      purpose: document.getElementById("purpose").value,
      host: document.getElementById("host").value,
      checkInTime: serverTimestamp()
    };

    push(ref(db, "visitors"), visitor)
      .then(() => {
        status.className = "success";
        status.innerHTML = checkIcon + "Checked in successfully!";
        form.reset();
      })
      .catch((err) => {
        status.className = "error";
        status.innerHTML = errorIcon + err.message;
      })
      .finally(() => {
        spinner.style.display = "none";
        btnText.textContent = "Check In";
        submitBtn.disabled = false;
      });
  });
</script>

</body>
</html>
