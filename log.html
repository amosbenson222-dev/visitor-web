<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Log</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Poppins', Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #16294f 0%, #1F3864 45%, #3b5998 100%);
    padding: 20px 14px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 18px;
    padding: 26px 20px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.28);
    animation: fadeUp 0.5s ease-out;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .header-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #1F3864, #4a6ba8);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .header-icon svg { width: 20px; height: 20px; stroke: #fff; }

  h1 { font-size: 19px; color: #1F3864; margin: 0; font-weight: 700; }
  .subtitle { color: #90979f; font-size: 12.5px; margin: 8px 0 18px; }

  .table-scroll { overflow-x: auto; border-radius: 12px; border: 1px solid #eef0f4; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
  th {
    background: #1F3864;
    color: #fff;
    padding: 11px 14px;
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  td { padding: 11px 14px; border-bottom: 1px solid #eef0f4; color: #333; }
  tbody tr { animation: rowIn 0.35s ease-out backwards; transition: background 0.15s; }
  tbody tr:hover td { background: #f4f6fb; }
  tbody tr:nth-child(even) td { background: #fafbfd; }

  .empty { text-align: center; color: #999; padding: 30px 12px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    color: #1F3864;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .back-link:hover { opacity: 0.7; }
  .back-link svg { width: 14px; height: 14px; stroke: #1F3864; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
    </div>
    <h1>Visitor Log</h1>
  </div>
  <p class="subtitle">Live record of all check-ins</p>

  <div class="table-scroll">
    <table>
      <thead>
        <tr><th>Name</th><th>Phone</th><th>Purpose</th><th>Host</th><th>Time</th></tr>
      </thead>
      <tbody id="logBody">
        <tr><td colspan="5" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Back to Check-In
  </a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDa0X6lqLr56HGdtgVkvUIGbfbJj9jOsYw",
    authDomain: "visitor-management-syste-fd524.firebaseapp.com",
    databaseURL: "https://visitor-management-syste-fd524-default-rtdb.firebaseio.com",
    projectId: "visitor-management-syste-fd524",
    storageBucket: "visitor-management-syste-fd524.firebasestorage.app",
    messagingSenderId: "789269734621",
    appId: "1:789269734621:web:071dc82156fad17ab22734"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const logBody = document.getElementById("logBody");

  onValue(ref(db, "visitors"), (snapshot) => {
    const data = snapshot.val();
    logBody.innerHTML = "";

    if (!data) {
      logBody.innerHTML = "<tr><td colspan='5' class='empty'>No visitors yet.</td></tr>";
      return;
    }

    const entries = Object.values(data).sort((a, b) => (b.checkInTime || 0) - (a.checkInTime || 0));

    entries.forEach((v, i) => {
      const time = v.checkInTime ? new Date(v.checkInTime).toLocaleString() : "-";
      const row = document.createElement("tr");
      row.style.animationDelay = (i * 0.05) + "s";
      row.innerHTML = `<td>${v.name}</td><td>${v.phone}</td><td>${v.purpose}</td><td>${v.host}</td><td>${time}</td>`;
      logBody.appendChild(row);
    });
  });
</script>

</body>
                                                                                                                                                                                                  </html>
